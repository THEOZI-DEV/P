<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pair Code Generator</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        .icon { font-size: 48px; margin-bottom: 10px; }
        h2 { margin: 0 0 8px 0; font-size: 22px; color: #fff; }
        p { margin: 0 0 20px 0; font-size: 14px; color: #94a3b8; }
        label { display: block; text-align: left; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #cbd5e1; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 14px; margin-top: 16px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px dashed #475569; font-family: monospace; font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; word-break: break-all; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🤖</div>
        <h2>WhatsApp Pair Code</h2>
        <p>Liez votre appareil WhatsApp facilement</p>
        
        <label for="phone">Numéro de téléphone (avec indicatif)</label>
        <input type="text" id="phone" placeholder="Ex: 50932035470">
        
        <button id="btn" onclick="getCode()">Générer le Code</button>
        
        <div class="result" id="codeBox">Ton code s'affichera ici</div>
    </div>

    <script>
        async function getCode() {
            const phone = document.getElementById('phone').value.trim();
            const codeBox = document.getElementById('codeBox');
            const btn = document.getElementById('btn');

            if (!phone) return alert('Veuillez entrer votre numéro !');

            btn.disabled = true;
            codeBox.className = 'result';
            codeBox.innerText = '⏳ Génération en cours (10-15s)...';

            try {
                // timeout 30s côté client
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);

                const res = await fetch(`/pair?phone=${phone}`, { signal: controller.signal });
                clearTimeout(timeout);

                const data = await res.json();

                if (data.code) {
                    codeBox.innerText = data.code;
                } else {
                    codeBox.className = 'result error';
                    codeBox.innerText = '❌ ' + (data.error || 'Erreur inconnue');
                }
            } catch (err) {
                codeBox.className = 'result error';
                codeBox.innerText = err.name === 'AbortError' ? '⏰ Timeout — réessaie' : '❌ Erreur serveur';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
